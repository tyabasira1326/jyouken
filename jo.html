<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>条</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:#1a1a2e;color:#e0e0e0;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;}
h1{font-size:13px;letter-spacing:4px;color:#888;padding:8px 0 4px;text-align:center;}

/* 表示エリア */
.display-area{width:100%;max-width:420px;padding:8px 12px 4px;position:relative;}
.field{display:grid;grid-template-areas:"top top""left center right""bottom bottom";grid-template-columns:1fr 80px 1fr;grid-template-rows:auto auto auto;gap:4px;}

.player-box{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:52px;}
.player-box.top{grid-area:top;}
.player-box.left{grid-area:left;}
.player-box.right{grid-area:right;}
.player-box.bottom{grid-area:bottom;}

.player-num{width:22px;height:22px;border-radius:50%;background:#2a2a4a;border:1.5px solid #555;font-size:11px;display:flex;align-items:center;justify-content:center;color:#aaa;cursor:pointer;flex-shrink:0;}
.player-num.active{background:#3a3a6a;border-color:#7a7aff;}
.player-inner{display:flex;align-items:center;gap:4px;}
.player-name-disp{font-size:13px;color:#ccc;}
.player-score-box{border:1.5px solid #7a7aff;border-radius:6px;padding:2px 8px;font-size:15px;font-weight:bold;color:#a0c4ff;min-width:64px;text-align:center;}
.player-box.bottom .player-score-box{display:none;}
.player-box.bottom .player-name-disp{color:#7a7aff;font-weight:bold;font-size:14px;}
.view-label{font-size:10px;color:#555;margin-top:2px;}

/* 中央エリア（矢印・点差） */
.center-area{grid-area:center;display:flex;align-items:center;justify-content:center;position:relative;}
.triangle-wrap{position:relative;width:80px;height:80px;}
.diff-label{position:absolute;font-size:10px;color:#888;white-space:nowrap;text-align:center;}
.diff-label.top-left{top:8px;left:-48px;}
.diff-label.top-right{top:8px;right:-48px;}
.diff-label.bottom-center{bottom:0px;left:50%;transform:translateX(-50%);}
svg.arrows{position:absolute;top:0;left:0;width:100%;height:100%;overflow:visible;}

/* ボタン行 */
.btn-row{width:100%;max-width:420px;display:flex;justify-content:space-between;align-items:center;padding:4px 12px;}
.ac-btn{background:#2a1a1a;border:1.5px solid #a04040;color:#e08080;font-size:14px;font-weight:bold;border-radius:8px;padding:6px 18px;cursor:pointer;}
.rotate-btn{background:#1a2a1a;border:1.5px solid #407040;color:#80c080;font-size:14px;font-weight:bold;border-radius:8px;padding:6px 18px;cursor:pointer;}
.view-info{font-size:11px;color:#555;text-align:center;}

/* 繰エリア */
.section{width:100%;max-width:420px;padding:4px 12px;}
.section-title{font-size:11px;color:#888;letter-spacing:2px;margin-bottom:4px;}
.kuri-table,.mochi-table{width:100%;border-collapse:collapse;}
.kuri-table td,.mochi-table td{border:1px solid #333;padding:2px 4px;font-size:13px;}
.num-circle{width:20px;height:20px;border-radius:50%;border:1.5px solid #555;font-size:10px;display:inline-flex;align-items:center;justify-content:center;color:#aaa;}
.name-cell{width:60px;color:#ccc;}
.score-cell{color:#a0c4ff;cursor:pointer;text-align:right;min-width:80px;}
.score-cell:active,.name-cell-input:active{background:#2a2a4a;}
.name-cell-tap{cursor:pointer;color:#ccc;}

/* キーパッド */
.keypad-overlay{display:none;position:fixed;bottom:0;left:0;right:0;background:#0d0d1a;border-top:2px solid #333;padding:8px;z-index:100;}
.keypad-overlay.active{display:block;}
.keypad-display{background:#111;color:#a0c4ff;font-size:20px;text-align:right;padding:6px 12px;border-radius:6px;margin-bottom:8px;min-height:36px;letter-spacing:1px;}
.keypad-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.kp-btn{background:#1e1e3a;border:1px solid #333;color:#e0e0e0;font-size:18px;padding:12px 0;border-radius:8px;cursor:pointer;text-align:center;}
.kp-btn:active{background:#2a2a5a;}
.kp-btn.kp-minus{color:#f08080;}
.kp-btn.kp-clear{color:#e0c080;}
.kp-btn.kp-ok{background:#1a3a1a;border-color:#407040;color:#80c080;font-weight:bold;}
.kp-btn.kp-del{color:#c0a0e0;}

/* 名前キーボード */
.name-overlay{display:none;position:fixed;bottom:0;left:0;right:0;background:#0d0d1a;border-top:2px solid #333;padding:8px;z-index:100;}
.name-overlay.active{display:block;}
.name-display{background:#111;color:#e0e0ff;font-size:18px;text-align:center;padding:6px;border-radius:6px;margin-bottom:8px;min-height:36px;letter-spacing:2px;}
.name-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:6px;}
.nk-btn{background:#1e1e3a;border:1px solid #333;color:#e0e0e0;font-size:15px;padding:10px 0;border-radius:6px;cursor:pointer;text-align:center;}
.nk-btn:active{background:#2a2a5a;}
.name-ctrl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
.nk-ctrl{background:#1e1e3a;border:1px solid #333;color:#c0a0e0;font-size:14px;padding:10px 0;border-radius:6px;cursor:pointer;text-align:center;}
.nk-ctrl.ok{background:#1a3a1a;border-color:#407040;color:#80c080;}

/* 数字選択オーバーレイ */
.num-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:center;justify-content:center;}
.num-overlay.active{display:flex;}
.num-picker{background:#1a1a2e;border:1px solid #444;border-radius:12px;padding:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.np-btn{background:#2a2a4a;border:1.5px solid #555;color:#e0e0e0;font-size:16px;padding:12px 24px;border-radius:8px;cursor:pointer;text-align:center;}
.np-btn:active{background:#3a3a6a;}

/* AC確認 */
.ac-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:300;align-items:center;justify-content:center;}
.ac-overlay.active{display:flex;}
.ac-dialog{background:#1a1a2e;border:1px solid #a04040;border-radius:12px;padding:24px;text-align:center;width:260px;}
.ac-dialog p{color:#e0e0e0;margin-bottom:16px;font-size:15px;}
.ac-dialog-btns{display:flex;gap:12px;justify-content:center;}
.ac-yes{background:#3a1a1a;border:1.5px solid #a04040;color:#e08080;font-size:16px;padding:10px 28px;border-radius:8px;cursor:pointer;}
.ac-no{background:#1e1e3a;border:1.5px solid #444;color:#ccc;font-size:16px;padding:10px 28px;border-radius:8px;cursor:pointer;}
</style>
</head>

<script>
// === 状態 ===
// players[i]: index 0〜3 = スロット（丸数字①〜④に対応）
// position配列: [top, left, right, bottom(視点)] に表示するplayerIndex
let players = [
  {name:'やま', kuri:0, mochi:25},
  {name:'いの', kuri:0, mochi:25},
  {name:'すがí', kuri:0, mochi:25},
  {name:'たな', kuri:0, mochi:25},
];
// positions[0]=top, [1]=left, [2]=right, [3]=bottom(視点)
let positions = [0,1,2,3]; // playerIndex

// キーパッド状態
let kpTarget = null; // {type:'kuri'|'mochi', idx:0-3}
let kpVal = '';

// 名前KB状態
let nameTarget = null;
let nameCur = '';

// 数字選択
let numPickerPos = null; // 'top'|'left'|'right'|'bottom'

const KANA = ['あ','い','う','え','お','か','き','く','け','こ','さ','し','す','せ','そ','た','ち','つ','て','と','な','に','ぬ','ね','の','は','ひ','ふ','へ','ほ','ま','み','む','め','も','や','ゆ','よ','ら','り','る','れ','ろ','わ','を','ん','ー','！','？','　'];

function fmt(v){
  let n = parseFloat(v)||0;
  let s = Math.abs(n).toFixed(1);
  return (n<0?'▲':'+') + s;
}
function total(i){return players[i].kuri + players[i].mochi;}

function updateAll(){
  // 繰・持テーブル
  for(let i=0;i<4;i++){
    let num = i+1;
    document.getElementById('kuri-num-'+i).textContent = circled(num);
    document.getElementById('kuri-name-'+i).textContent = players[i].name;
    document.getElementById('kuri-score-'+i).textContent = fmt(players[i].kuri);
    document.getElementById('mochi-num-'+i).textContent = circled(num);
    document.getElementById('mochi-name-'+i).textContent = players[i].name;
    document.getElementById('mochi-score-'+i).textContent = fmt(players[i].mochi);
  }
  updateDisplay();
}

function circled(n){return ['①','②','③','④'][n-1]||n;}

function updateDisplay(){
  const pos = ['top','left','right','bottom'];
  for(let p=0;p<4;p++){
    let pi = positions[p];
    let num = pi+1;
    document.getElementById('num-'+pos[p]).textContent = circled(num);
    document.getElementById('name-'+pos[p]).textContent = players[pi].name;
  }
  // 視点(bottom=positions[3])
  let viewIdx = positions[3];
  let viewTotal = total(viewIdx);

  // 上・左・右の点差
  const posNames = ['top','left','right'];
  const diffs = {};
  for(let p=0;p<3;p++){
    let pi = positions[p];
    let d = total(pi) - viewTotal;
    let s = Math.abs(d).toFixed(1);
    let sign = d>=0?'+':'▲';
    document.getElementById('score-'+posNames[p]).textContent = sign+s;
    diffs[posNames[p]] = total(pi);
  }

  // 2者間点差（）
  let topV = diffs['top'], leftV = diffs['left'], rightV = diffs['right'];
  document.getElementById('diff-tl').textContent = '('+Math.abs(topV-leftV).toFixed(1)+')';
  document.getElementById('diff-tr').textContent = '('+Math.abs(topV-rightV).toFixed(1)+')';
  document.getElementById('diff-bc').textContent = '('+Math.abs(leftV-rightV).toFixed(1)+')';

  drawArrows(topV, leftV, rightV);
}

function drawArrows(topV, leftV, rightV){
  const svg = document.getElementById('arrow-svg');
  svg.innerHTML = '';
  // 3頂点: top=(40,5), left=(5,75), right=(75,75)
  const pts = {top:[40,5], left:[5,75], right:[75,75]};
  const pairs = [['top','left',topV,leftV],['top','right',topV,rightV],['left','right',leftV,rightV]];
  const ns = 'http://www.w3.org/2000/svg';
  // marker
  let defs = document.createElementNS(ns,'defs');
  let marker = document.createElementNS(ns,'marker');
  marker.setAttribute('id','arr');marker.setAttribute('markerWidth','6');marker.setAttribute('markerHeight','6');
  marker.setAttribute('refX','5');marker.setAttribute('refY','3');marker.setAttribute('orient','auto');
  let path = document.createElementNS(ns,'path');
  path.setAttribute('d','M0,0 L6,3 L0,6 Z');path.setAttribute('fill','#7a7aff');
  marker.appendChild(path);defs.appendChild(marker);svg.appendChild(defs);

  pairs.forEach(([a,b,va,vb])=>{
    let from = va<=vb?pts[a]:pts[b];
    let to   = va<=vb?pts[b]:pts[a];
    if(Math.abs(va-vb)<0.05) return; // 同点はスキップ
    let line = document.createElementNS(ns,'line');
    let dx=to[0]-from[0], dy=to[1]-from[1], len=Math.sqrt(dx*dx+dy*dy);
    let ux=dx/len, uy=dy/len;
    let margin=8;
    line.setAttribute('x1',from[0]+ux*margin);
    line.setAttribute('y1',from[1]+uy*margin);
    line.setAttribute('x2',to[0]-ux*(margin+2));
    line.setAttribute('y2',to[1]-uy*(margin+2));
    line.setAttribute('stroke','#7a7aff');
    line.setAttribute('stroke-width','1.5');
    line.setAttribute('marker-end','url(#arr)');
    svg.appendChild(line);
  });
}

// 回転: bottom→right, right→top, top→left, left→bottom
function rotate(){
  // positions: [top, left, right, bottom]
  // 反時計回り: 下→右, 右→上, 上→左, 左→下
  let [t,l,r,b] = positions;
  positions = [r,t,l,b]; // 新top=旧right, 新left=旧top, 新right=旧left, bottom固定... 
  // 仕様再確認: 下→右移動, 右→上, 上→左, 左→下(新視点)
  // つまり: 新bottom=旧left, 新left=旧top, 新top=旧right, 新right=旧bottom
  let orig = [...positions];
  // reset
  [t,l,r,b] = [orig[0],orig[1],orig[2],orig[3]];
  // ここで再計算し直す（正しい回転）
  // 元: top=t, left=l, right=r, bottom=b
  // 反時計: bottom→right, right→top, top→left, left→bottom
  positions = [r, b, t, l];
  // [new_top=旧right, new_left=旧bottom, new_right=旧top, new_bottom=旧left]
  // → new視点=旧left ✓, 下→右=旧bottom→new_left? 
  // 仕様: 下→右, 右→上, 上→左, 左→下
  // new_right=旧top✓, new_top=旧right✓, new_left=旧bottom✗(旧bottomが新leftになってしまう)
  // 正しくは: new_top=旧right, new_left=旧top, new_right=旧bottom... 
  // 仕様通り: 下→右, 右→上, 上→左, 左→下(視点)
  // [top,left,right,bottom]: new=[旧right, 旧top, 旧bottom, 旧left]... 
  // 下→右: 旧bottom→new_right ✓
  // 右→上: 旧right→new_top ✓  
  // 上→左: 旧top→new_left ✓
  // 左→下: 旧left→new_bottom ✓
  let [ot,ol,or_,ob] = [t,l,r,b];
  positions = [or_, ot, ob, ol];
  updateDisplay();
}

// キーパッド
function openKeypad(type, idx){
  kpTarget = {type, idx};
  let cur = type==='kuri'?players[idx].kuri:players[idx].mochi;
  kpVal = cur===0?'':(cur<0?'▲'+Math.abs(cur).toFixed(1):''+cur.toFixed(1));
  document.getElementById('kp-display').textContent = kpVal||'0';
  document.getElementById('keypad').classList.add('active');
}
function kpInput(c){
  if(c==='▲'){
    if(kpVal.startsWith('▲')) kpVal=kpVal.slice(1);
    else kpVal='▲'+kpVal;
  } else if(c==='.'){
    if(!kpVal.includes('.')) kpVal+=c;
  } else {
    // 上書きモード: 最初の入力で全クリア
    kpVal += c;
  }
  document.getElementById('kp-display').textContent = kpVal||'0';
}
function kpDel(){kpVal=kpVal.slice(0,-1);document.getElementById('kp-display').textContent=kpVal||'0';}
function kpClear(){kpVal='';document.getElementById('kp-display').textContent='0';}
function kpOK(){
  if(!kpTarget) return;
  let neg = kpVal.startsWith('▲');
  let num = parseFloat(kpVal.replace('▲',''))||0;
  if(neg) num=-num;
  let {type,idx} = kpTarget;
  if(type==='kuri') players[idx].kuri=num;
  else players[idx].mochi=num;
  document.getElementById('keypad').classList.remove('active');
  kpTarget=null; kpVal='';
  updateAll();
}

// 名前KB
function buildKanaGrid(){
  let g = document.getElementById('kana-grid');
  g.innerHTML='';
  KANA.forEach(k=>{
    let d=document.createElement('div');
    d.className='nk-btn';
    d.textContent=k;
    d.onclick=()=>{if(nameCur.length<3){nameCur+=k;document.getElementById('name-disp-cur').textContent=nameCur;}};
    g.appendChild(d);
  });
}
function openNameKB(idx){
  nameTarget=idx;
  nameCur=players[idx].name;
  document.getElementById('name-disp-cur').textContent=nameCur;
  buildKanaGrid();
  document.getElementById('name-overlay').classList.add('active');
}
function nameDel(){nameCur=nameCur.slice(0,-1);document.getElementById('name-disp-cur').textContent=nameCur;}
function nameClear(){nameCur='';document.getElementById('name-disp-cur').textContent='';}
function nameOK(){
  if(nameTarget===null) return;
  if(nameCur.trim()) players[nameTarget].name=nameCur.trim();
  document.getElementById('name-overlay').classList.remove('active');
  nameTarget=null;
  updateAll();
}

// 数字選択
function openNumPicker(pos){
  numPickerPos=pos;
  document.getElementById('num-overlay').classList.add('active');
}
function closeNumPicker(){document.getElementById('num-overlay').classList.remove('active');numPickerPos=null;}
function selectNum(n){
  if(!numPickerPos) return;
  let posIdx={'top':0,'left':1,'right':2,'bottom':3}[numPickerPos];
  let newPi = n-1; // playerIndex
  // 現在そのposにいるplayerと交換
  let oldPi = positions[posIdx];
  let swapIdx = positions.indexOf(newPi);
  if(swapIdx>=0) positions[swapIdx]=oldPi;
  positions[posIdx]=newPi;
  closeNumPicker();
  updateDisplay();
}

// AC
function openAC(){document.getElementById('ac-overlay').classList.add('active');}
function closeAC(){document.getElementById('ac-overlay').classList.remove('active');}
function doAC(){
  players=[
    {name:'やま',kuri:0,mochi:25},
    {name:'いの',kuri:0,mochi:25},
    {name:'すがí',kuri:0,mochi:25},
    {name:'たな',kuri:0,mochi:25},
  ];
  positions=[0,1,2,3];
  closeAC();
  updateAll();
}

// 初期化
buildKanaGrid();
updateAll();
</script>
